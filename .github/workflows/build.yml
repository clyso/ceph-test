name: Build and Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Called by auto-release.yml: builds the version from the current commit
  # and creates the tag with the release.
  workflow_call:
    inputs:
      version:
        description: Ceph version to release, e.g. v20.2.4
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse tags
        id: meta
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "ceph_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "platform_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${VERSION}-${PLATFORM_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (single platform)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.platform_image }}
          build-args: |
            CEPH_VERSION=${{ steps.meta.outputs.ceph_version }}

      - name: Health check
        # Backstop: the script gives up after 5 min.
        timeout-minutes: 15
        run: .github/health-check.sh ${{ steps.meta.outputs.platform_image }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Parse tags
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${VERSION}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 1000 \
            --json tagName --jq '.[].tagName')

          # The moving vX.Y and vX tags only go forward: skip them when a
          # newer release of that minor/major exists (e.g. an older version
          # tagged by hand). Only vX.Y.Z versions get them.
          TAGS="${IMAGE}:${TAG}"
          if [[ "$TAG" =~ ^(v[0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR="${MAJOR}.${BASH_REMATCH[2]}"
            SORTED=$(printf '%s\n%s\n' "$RELEASES" "$TAG" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV)
            if [ "$(grep "^${MINOR//./\\.}\." <<< "$SORTED" | tail -1)" = "$TAG" ]; then
              TAGS="${TAGS},${IMAGE}:${MINOR}"
            fi
            if [ "$(grep "^${MAJOR}\." <<< "$SORTED" | tail -1)" = "$TAG" ]; then
              TAGS="${TAGS},${IMAGE}:${MAJOR}"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "amd64=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${TAG}-linux-amd64" >> "$GITHUB_OUTPUT"
          echo "arm64=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${TAG}-linux-arm64" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multiarch manifest
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            # GHCR shows a multiarch package's description from the index
            # annotation, not from the image label.
            docker buildx imagetools create -t "$tag" \
              --annotation "index:org.opencontainers.image.description=Single-node Ceph cluster (mon + mgr + osd + rgw) in one container, for testing" \
              ${{ steps.meta.outputs.amd64 }} \
              ${{ steps.meta.outputs.arm64 }}
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${VERSION}"
          TAGS="${{ steps.meta.outputs.tags }}"
          BODY="## Images (linux/amd64, linux/arm64)"
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            BODY=$(printf '%s\n```\ndocker pull %s\n```' "$BODY" "$tag")
          done

          # Only the highest version is marked Latest, so a release of an
          # older major does not take it over.
          RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 1000 \
            --json tagName --jq '.[].tagName')
          NEWEST=$(printf '%s\n%s\n' "$RELEASES" "$TAG" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST=false
          if [ "$NEWEST" = "$TAG" ]; then LATEST=true; fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --latest="$LATEST" \
            --notes "$BODY"
